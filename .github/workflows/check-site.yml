name: Check live site
# Opens the live GitHub Pages site in a real browser and saves screenshots (Actions › run › Artifacts).
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Screenshots
        run: |
          npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > s.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            for (const [w,h,n] of [[1366,900,'desktop'],[390,844,'phone']]) {
              const p = await b.newPage({ viewport:{width:w,height:h} });
              const errs=[]; p.on('pageerror',e=>errs.push(e.message)); p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
              const r = await p.goto('https://philipviegas84-svg.github.io/vidacruz/', {waitUntil:'networkidle'});
              console.log(n, 'status', r.status(), 'title', await p.title(), 'errors', JSON.stringify(errs));
              await p.screenshot({path:`site-${n}.png`});
            }
            const p = await b.newPage();
            const g = await p.goto('https://philipviegas84-svg.github.io/vidacruz/guide/daily-brief-lite.html');
            console.log('guide status', g.status());
            const pdf = await p.request.get('https://philipviegas84-svg.github.io/vidacruz/guide/daily-brief-lite.pdf');
            console.log('pdf status', pdf.status());
            await b.close();
          })();
          JS
          node s.js
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: site-*.png
